<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in — Affilio</title>
<meta name="theme-color" content="#14171C" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="9" width="16" height="16" rx="6" transform="rotate(-20 2 9)" stroke="#D4AF6A" stroke-width="2.4"/>
          <rect x="10" y="5" width="16" height="16" rx="6" transform="rotate(-20 10 5)" stroke="currentColor" stroke-width="2.4" fill="none"/>
        </svg>
        <h1 style="font-family:'Fraunces',serif;font-weight:700;font-size:24px;margin:0;">Affil<em style="color:var(--gold);font-style:italic;">io</em></h1>
      </div>
      <p class="tagline">Track. Share. <em>Earn.</em></p>

      <div class="auth-error" id="auth-error"></div>

      <button class="btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="auth-divider">or</div>

      <form id="email-form">
        <div class="field"><label for="email">Email</label><input id="email" type="email" required placeholder="you@example.com" /></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="6" placeholder="••••••••" /></div>
        <button type="submit" class="btn-primary btn-block" id="submit-btn">Sign in</button>
      </form>

      <p class="auth-switch" id="switch-mode">Don't have an account? <a id="switch-link">Create one</a></p>
      <p class="auth-switch"><a id="forgot-link">Forgot password?</a></p>
    </div>
  </div>

  <script type="module">
    import { signInWithGoogle, signInWithEmail, signUpWithEmail, resetPassword, watchAuth, friendlyAuthError, consumeRedirectResult } from './js/auth.js';

    const errorBox = document.getElementById('auth-error');
    function showError(msg) { errorBox.textContent = msg; errorBox.classList.add('show'); }
    function clearError() { errorBox.classList.remove('show'); }

    let mode = 'signin'; // or 'signup'

    document.getElementById('google-btn').addEventListener('click', async () => {
      clearError();
      try { await signInWithGoogle(); }
      catch (err) { showError(friendlyAuthError(err)); }
    });

    document.getElementById('email-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        if (mode === 'signup') await signUpWithEmail(email, password);
        else await signInWithEmail(email, password);
      } catch (err) {
        showError(friendlyAuthError(err));
      } finally {
        btn.disabled = false;
      }
    });

    function toggleMode() {
      mode = mode === 'signin' ? 'signup' : 'signin';
      document.getElementById('submit-btn').textContent = mode === 'signup' ? 'Create account' : 'Sign in';
      document.getElementById('switch-mode').innerHTML = mode === 'signup'
        ? `Already have an account? <a id="switch-link">Sign in</a>`
        : `Don't have an account? <a id="switch-link">Create one</a>`;
      document.getElementById('switch-link').addEventListener('click', toggleMode);
      clearError();
    }
    document.getElementById('switch-link').addEventListener('click', toggleMode);

    document.getElementById('forgot-link').addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) { showError('Enter your email above first, then tap "Forgot password?"'); return; }
      clearError();
      try { await resetPassword(email); showError('Password reset email sent — check your inbox.'); errorBox.style.color = 'var(--mint)'; }
      catch (err) { showError(friendlyAuthError(err)); }
    });

    // If already signed in (or redirect flow just completed), bounce to the app.
    consumeRedirectResult().catch(() => {});
    watchAuth((user) => { if (user) window.location.href = './index.html'; });
  </script>
</body>
</html>
